[project]
name = "slop-image-site"
version = "0.1.0"
description = "Render a static website as a PNG with clickable links"
readme = "README.md"
authors = [
    { name = "ywbird", email = "ywbird@naver.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pillow>=13.0.0",
]

[project.scripts]
image-site = "image_site:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "image_site"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
]
